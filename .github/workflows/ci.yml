name: PulseCI - Automated CI Pipeline

# Workflow triggers
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Job definitions
jobs:
  build-and-test:
    name: Build, Run, and Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Set up Python runtime environment
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Execute the application
      - name: Execute application
        run: |
          echo "Running PulseCI Application..."
          python app.py

      # Step 5: Run automated test suite with Pytest
      - name: Run Pytest test suite
        run: |
          echo "Running automated unit and boundary tests..."
          pytest -v --junitxml=pytest-results.xml

      # Step 6: Pipeline success summary
      - name: CI Success Notice
        if: success()
        run: |
          echo "### PulseCI Build & Test Successful! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "All unit tests, boundary validations, and app execution passed without errors." >> $GITHUB_STEP_SUMMARY

      # Step 7: Pipeline failure summary
      - name: CI Failure Notice
        if: failure()
        run: |
          echo "### PulseCI Build & Test Failed! :x:" >> $GITHUB_STEP_SUMMARY
          echo "One or more checks, app execution steps, or automated tests failed. Please inspect the logs above." >> $GITHUB_STEP_SUMMARY
